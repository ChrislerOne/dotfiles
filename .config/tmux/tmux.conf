# Terminal settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Prefix key
set -g prefix C-b
bind C-b send-prefix

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse support
set -g mouse on

# Vi mode for copy
setw -g mode-keys vi

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style splits (open in current path)
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Faster escape time
set -sg escape-time 0

# Increase history
set -g history-limit 50000

# Catppuccin theme
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Prepend Homebrew to the server env for plugin scripts, keeping the inherited PATH
run-shell 'for p in /opt/homebrew /usr/local /home/linuxbrew/.linuxbrew; do [ -x "$p/bin/tmux" ] || continue; case ":$PATH:" in *":$p/bin:"*) ;; *) "$p/bin/tmux" set-environment -g PATH "$p/bin:$p/sbin:$PATH" ;; esac; break; done'

# Bootstrap TPM (brew formula, declared in Brewfile); absolute paths so this
# works regardless of the PATH tmux was launched with
run-shell 'for p in /opt/homebrew /usr/local /home/linuxbrew/.linuxbrew; do [ -x "$p/opt/tpm/share/tpm/tpm" ] && exec "$p/opt/tpm/share/tpm/tpm"; done'
